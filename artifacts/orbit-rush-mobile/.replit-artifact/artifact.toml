kind = "mobile"
previewPath = "/orbit-rush-mobile/"
title = "Orbit Rush Mobile"
description = "A native iOS and Android arcade game with one-finger steering, clear interactive tutorials, quick runs, and locally saved scores and cosmetic unlocks."
version = "1.0.0"
id = "artifacts/orbit-rush-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/orbit-rush-mobile/" ]
localPort = 25019

[services.development]
run = "pnpm --filter @workspace/orbit-rush-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orbit-rush-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/orbit-rush-mobile", "run", "serve" ]

[services.env]
PORT = "25019"
BASE_PATH = "/orbit-rush-mobile/"
